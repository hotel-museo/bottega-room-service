<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOTTEGA 번역관리</title><style>
*{box-sizing:border-box}html:not(.auth-ready) body{visibility:hidden}body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}.layout{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#161616;color:#fff;padding:28px 14px}.logo{padding:0 12px 26px;border-bottom:1px solid #333;margin-bottom:20px}.logo h1{margin:0;font-size:21px;letter-spacing:3px}.logo p{margin:7px 0 0;color:#888;font-size:10px;letter-spacing:2px}.item{width:100%;border:0;background:transparent;color:#aaa;padding:12px 14px;border-radius:8px;text-align:left;font-size:14px;font-weight:bold;cursor:pointer;margin:2px 0}.item:hover{background:#242424;color:#fff}.item.active{background:#fff;color:#111}.logout{margin-top:12px;border:1px solid #444}.main{margin-left:220px}header{background:#111;color:#fff;padding:28px 25px}header h1{margin:0;font-size:23px}header p{margin:7px 0 0;color:#aaa;font-size:11px;letter-spacing:1.5px}.container{max-width:1180px;margin:20px auto 80px;padding:0 18px}.panel{background:#fff;border-radius:12px;padding:18px;margin-bottom:15px}.panel h2{margin:0 0 6px;font-size:18px}.sub{color:#888;font-size:12px;line-height:1.6;margin-bottom:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid #ddd;background:#fff;border-radius:20px;padding:8px 13px;cursor:pointer;font-weight:bold;font-size:12px}.tab.active{background:#111;color:#fff;border-color:#111}.card{border:1px solid #e4e4e4;border-radius:12px;padding:16px;margin-bottom:12px;background:#fafafa}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.head strong{font-size:15px}.badge{font-size:11px;padding:5px 9px;border-radius:15px;background:#eee}.badge.locked{background:#fff0d8;color:#805500}.grid{display:grid;grid-template-columns:110px 1fr 1fr 1fr;gap:8px;align-items:start}.label{font-size:11px;font-weight:bold;color:#666;padding-top:11px}input,textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;font:inherit;background:#fff}textarea{min-height:74px;resize:vertical}.ko{background:#f2f2f2}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}button.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}.black{background:#111;color:#fff}.gray{background:#eee;color:#333}.gold{background:#fff0d8;color:#805500}.saving{position:fixed;bottom:20px;left:calc(50% + 110px);transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:25px;display:none;z-index:99}.saving.show{display:block}@media(max-width:800px){.sidebar{position:relative;width:100%}.main{margin-left:0}.grid{grid-template-columns:1fr}.label{padding-top:0}.saving{left:50%}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="logo"><h1>BOTTEGA</h1><p>ADMIN</p></div><button class="item" onclick="location.href='admin.html'">주문관리</button><button class="item" onclick="location.href='menu-admin.html'">메뉴관리</button><button class="item active">번역관리</button><button class="item" onclick="location.href='sales-admin.html'">매출관리</button><button class="item" onclick="location.href='menu-admin.html?view=design'">주문페이지 디자인</button><button class="item logout" onclick="adminLogout()">로그아웃</button></aside><div class="main"><header><h1>번역관리</h1><p>ROOM SERVICE · TRANSLATION MANAGEMENT</p></header><div class="container"><div class="panel"><h2>번역 검수 / 수정</h2><div class="sub">한국어 원문은 메뉴관리에서 수정합니다. 이 페이지에서는 영어를 먼저 검수하고, <b>일본어 · 중국어는 영어를 기준으로 다시 번역</b>할 수 있습니다. <b>번역 잠금</b>을 켜면 메뉴관리의 전체 번역을 다시 실행해도 해당 항목은 덮어쓰지 않습니다.</div><div class="tabs" id="tabs"></div><div id="category-editor"></div></div><div class="panel"><h2>메뉴 번역</h2><div id="menu-list"></div></div></div></div></div><div class="saving" id="saving">저장 중...</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const BOTTEGA_REMEMBER_KEY='bottega_admin_remember';const bottegaAuthStorage={getItem(k){return sessionStorage.getItem(k)??localStorage.getItem(k)},setItem(k,v){const r=localStorage.getItem(BOTTEGA_REMEMBER_KEY)==='1'||sessionStorage.getItem(BOTTEGA_REMEMBER_KEY)==='1';if(r){localStorage.setItem(k,v);sessionStorage.removeItem(k)}else{sessionStorage.setItem(k,v);localStorage.removeItem(k)}},removeItem(k){sessionStorage.removeItem(k);localStorage.removeItem(k)}};
const supabaseClient=supabase.createClient('https://yookspgooyewhnkobckw.supabase.co','sb_publishable_uI5l3LBZPrZfuXJDLXMEqg_zFS3cbLp',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:bottegaAuthStorage}});let menus=[],categoryTranslations={},locks={menus:{},categories:{}},current='all';
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function saving(t){const e=document.getElementById('saving');e.textContent=t;e.classList.add('show')}function done(){document.getElementById('saving').classList.remove('show')}
async function requireLogin(){const {data,error}=await supabaseClient.auth.getUser();if(error||!data?.user){location.replace('login.html');return false}document.documentElement.classList.add('auth-ready');return true}async function adminLogout(){await supabaseClient.auth.signOut({scope:'local'});localStorage.removeItem(BOTTEGA_REMEMBER_KEY);sessionStorage.removeItem(BOTTEGA_REMEMBER_KEY);location.replace('login.html')}
async function load(){const [m,c,l]=await Promise.all([supabaseClient.from('menus').select('*').order('sort_order',{ascending:true}),supabaseClient.from('site_settings').select('settings').eq('key','category_translations').maybeSingle(),supabaseClient.from('site_settings').select('settings').eq('key','translation_locks').maybeSingle()]);if(m.error)throw m.error;menus=m.data||[];categoryTranslations=c.data?.settings||{};const x=l.data?.settings||{};locks={menus:x.menus||{},categories:x.categories||{}};renderTabs();render()}
function categories(){const a=[];for(const m of menus)if(m.category&&!a.includes(m.category))a.push(m.category);return a}function renderTabs(){const a=['all',...categories()];document.getElementById('tabs').innerHTML=a.map(c=>`<button class="tab ${c===current?'active':''}" onclick="selectCat('${String(c).replace(/'/g,"\'")}')">${c==='all'?'전체':esc(categoryTranslations[c]?.ko||c)}</button>`).join('')}function selectCat(c){current=c;renderTabs();render()}
function render(){renderCategory();const list=current==='all'?menus:menus.filter(m=>m.category===current);document.getElementById('menu-list').innerHTML=list.map(menuCard).join('')||'<div class="sub">메뉴가 없습니다.</div>'}
function renderCategory(){const box=document.getElementById('category-editor');if(current==='all'){box.innerHTML='<div class="sub">카테고리를 선택하면 카테고리 번역을 개별 수정할 수 있습니다.</div>';return}const t=categoryTranslations[current]||{ko:current,en:'',ja:'',zh:''};const locked=locks.categories[current]===true;box.innerHTML=`<div class="card"><div class="head"><strong>카테고리 번역</strong><span class="badge ${locked?'locked':''}">${locked?'🔒 번역 잠금':'자동번역 가능'}</span></div><div class="grid"><div class="label">한국어</div><input class="ko" value="${esc(t.ko||current)}" readonly><input id="cat-en" value="${esc(t.en||'')}" placeholder="English"><input id="cat-ja" value="${esc(t.ja||'')}" placeholder="日本語"><div class="label"></div><div></div><input id="cat-zh" value="${esc(t.zh||'')}" placeholder="中文"></div><div class="actions"><button class="btn gray" onclick="translateCategoryFromEnglish()">영어 기준 일·중 번역</button><button class="btn ${locked?'gray':'gold'}" onclick="toggleCategoryLock()">${locked?'잠금 해제':'번역 잠금'}</button><button class="btn black" onclick="saveCategory()">번역 저장</button></div></div>`}
function menuCard(m){const locked=locks.menus[String(m.id)]===true;return `<div class="card"><div class="head"><strong>${esc(m.name)}</strong><span class="badge ${locked?'locked':''}">${locked?'🔒 번역 잠금':'자동번역 가능'}</span></div><div class="grid"><div class="label">메뉴명</div><input class="ko" value="${esc(m.name)}" readonly><input id="n-en-${m.id}" value="${esc(m.name_en||'')}" placeholder="English"><input id="n-ja-${m.id}" value="${esc(m.name_ja||'')}" placeholder="日本語"><div class="label">메뉴명 · 중국어</div><div></div><input id="n-zh-${m.id}" value="${esc(m.name_zh||'')}" placeholder="中文"><div></div><div class="label">설명</div><textarea class="ko" readonly>${esc(m.description||'')}</textarea><textarea id="d-en-${m.id}" placeholder="English">${esc(m.description_en||'')}</textarea><textarea id="d-ja-${m.id}" placeholder="日本語">${esc(m.description_ja||'')}</textarea><div class="label">설명 · 중국어</div><div></div><textarea id="d-zh-${m.id}" placeholder="中文">${esc(m.description_zh||'')}</textarea><div></div></div><div class="actions"><button class="btn gray" onclick="translateMenuFromEnglish(${m.id})">영어 기준 일·중 번역</button><button class="btn ${locked?'gray':'gold'}" onclick="toggleMenuLock(${m.id})">${locked?'잠금 해제':'번역 잠금'}</button><button class="btn black" onclick="saveMenu(${m.id})">번역 저장</button></div></div>`}

function waitTranslation(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
async function translateTextFromEnglish(text,target,maxRetries=3){
  const source=String(text||'').trim();
  if(!source)return '';
  let lastError=null;
  for(let attempt=1;attempt<=maxRetries;attempt+=1){
    try{
      const {data,error}=await supabaseClient.functions.invoke('hyper-action',{body:{text:source,target}});
      if(error)throw new Error(error.message||'Edge Function 호출 실패');
      const result=data&&typeof data.translatedText==='string'?data.translatedText.trim():'';
      if(!result)throw new Error('빈 번역 결과');
      return result;
    }catch(e){
      lastError=e;
      console.warn(`TRANSLATE RETRY ${attempt}/${maxRetries}`,target,e);
      if(attempt<maxRetries)await waitTranslation(900*attempt);
    }
  }
  throw new Error(lastError?.message||'번역 실패');
}
async function translateCategoryFromEnglish(){
  const en=document.getElementById('cat-en')?.value.trim()||'';
  if(!en){alert('영어 번역을 먼저 입력하거나 수정해주세요.');return}
  saving('영어 기준 일본어 · 중국어 번역 중...');
  try{
    const ja=await translateTextFromEnglish(en,'ja'); await waitTranslation(250);
    const zh=await translateTextFromEnglish(en,'zh');
    document.getElementById('cat-ja').value=ja;
    document.getElementById('cat-zh').value=zh;
    saving('번역 완료 · 내용을 확인 후 번역 저장을 눌러주세요.');setTimeout(done,1200);
  }catch(e){done();alert('일본어 · 중국어 번역에 실패했습니다.\n'+(e.message||''))}
}
async function translateMenuFromEnglish(id){
  const nameEn=document.getElementById(`n-en-${id}`)?.value.trim()||'';
  const descEn=document.getElementById(`d-en-${id}`)?.value.trim()||'';
  if(!nameEn){alert('영어 메뉴명을 먼저 입력하거나 수정해주세요.');return}
  saving('영어 기준 일본어 · 중국어 번역 중...');
  try{
    const nameJa=await translateTextFromEnglish(nameEn,'ja'); await waitTranslation(250);
    const nameZh=await translateTextFromEnglish(nameEn,'zh'); await waitTranslation(250);
    let descJa='',descZh='';
    if(descEn){descJa=await translateTextFromEnglish(descEn,'ja');await waitTranslation(250);descZh=await translateTextFromEnglish(descEn,'zh')}
    document.getElementById(`n-ja-${id}`).value=nameJa;
    document.getElementById(`n-zh-${id}`).value=nameZh;
    document.getElementById(`d-ja-${id}`).value=descJa;
    document.getElementById(`d-zh-${id}`).value=descZh;
    saving('번역 완료 · 내용을 확인 후 번역 저장을 눌러주세요.');setTimeout(done,1200);
  }catch(e){done();alert('일본어 · 중국어 번역에 실패했습니다.\n'+(e.message||''))}
}

async function saveLocks(){const {error}=await supabaseClient.from('site_settings').upsert({key:'translation_locks',settings:locks},{onConflict:'key'});if(error)throw error}async function toggleMenuLock(id){locks.menus[String(id)]=!locks.menus[String(id)];await saveLocks();render()}async function toggleCategoryLock(){locks.categories[current]=!locks.categories[current];await saveLocks();renderCategory()}
async function saveMenu(id){saving('메뉴 번역 저장 중...');const payload={name_en:document.getElementById(`n-en-${id}`).value.trim()||null,name_ja:document.getElementById(`n-ja-${id}`).value.trim()||null,name_zh:document.getElementById(`n-zh-${id}`).value.trim()||null,description_en:document.getElementById(`d-en-${id}`).value.trim()||null,description_ja:document.getElementById(`d-ja-${id}`).value.trim()||null,description_zh:document.getElementById(`d-zh-${id}`).value.trim()||null};const {error}=await supabaseClient.from('menus').update(payload).eq('id',id);if(error){done();alert('저장 실패\n'+(error.message||''));return}locks.menus[String(id)]=true;await saveLocks();await load();saving('번역 저장 완료 · 자동 잠금됨');setTimeout(done,900)}
async function saveCategory(){saving('카테고리 번역 저장 중...');const old=categoryTranslations[current]||{};categoryTranslations[current]={ko:old.ko||current,en:document.getElementById('cat-en').value.trim(),ja:document.getElementById('cat-ja').value.trim(),zh:document.getElementById('cat-zh').value.trim()};let r=await supabaseClient.from('site_settings').upsert({key:'category_translations',settings:categoryTranslations},{onConflict:'key'});if(r.error){done();alert('저장 실패\n'+(r.error.message||''));return}locks.categories[current]=true;await saveLocks();renderCategory();saving('카테고리 번역 저장 완료 · 자동 잠금됨');setTimeout(done,900)}
(async()=>{if(await requireLogin()){try{await load()}catch(e){console.error(e);alert('번역 데이터를 불러오지 못했습니다.')}}})();
</script></body></html>
